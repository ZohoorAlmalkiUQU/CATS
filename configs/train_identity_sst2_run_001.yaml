experiment:
  dataset_name: sst2
  model_name: cats
  routing_type: identity
  run_name: run_001

data:
  processed_root: data/processed
  train_split: train
  val_split: validation
  test_split: test
  has_test: true

model:
  embedding_dim: 768
  hidden_dim: 256
  num_classes: 2
  excitatory_ratio: 0.5
  kwargs: {}

routing:
  kwargs: {}

lif:
  tau:
    learnable: true
    mode: per_group
    min: [12.0, 5.0]
    max: [24.0, 12.0]
    init: [18.0, 8.0]

  threshold:
    learnable: true
    mode: per_group
    min: [0.8, 0.4]
    max: [1.8, 1.2]
    init: [1.2, 0.8]

training:
  seed: 42
  deterministic: false
  batch_size: 32
  num_workers: 0
  pin_memory: true
  epochs: 10
  optimizer: adamw
  lr: 1e-4
  weight_decay: 1e-5
  criterion: cross_entropy
  grad_clip_norm: 1.0

  lambda_balance: 0.0
  lambda_entropy: 0.0
  lambda_inh_usage: 0.0
  target_inh_usage: 0.0
  
# No routing regularization is used for the identity router.
# Reason:
# - The identity setup does not learn routing decisions across groups.
# - There is no trainable routing distribution to balance, smooth, or constrain.
# - Therefore, balance/entropy/inhibitory-usage penalties are not meaningful here.
# - Keeping these terms at zero avoids adding artificial constraints to a no-routing baseline.

logging:
  base_dir: logs

checkpoints:
  base_dir: checkpoints
  best_name_template: best_{run_name}.pt
  latest_name_template: latest_{run_name}.pt

runtime:
  device: cuda