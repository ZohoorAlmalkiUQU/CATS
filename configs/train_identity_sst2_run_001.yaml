experiment:
  dataset_name: sst2
  model_name: cats
  routing_type: identity
  run_name: run_001

data:
  processed_root: data/processed
  train_split: train
  val_split: validation
  test_split: test
  has_test: true

model:
  embedding_dim: 768
  hidden_dim: 256
  num_classes: 2
  excitatory_ratio: 0.5
  kwargs: {}

routing:
  kwargs: {}

lif_exc:
  tau:
    learnable: true
    mode: shared
    min: 12.0
    max: 24.0
    init: 18.0

  threshold:
    learnable: true
    mode: shared
    min: 0.8
    max: 1.8
    init: 1.2

  adaptive_threshold:
    enabled: true
    mode: shared
    init: 0.0
    decay: 0.95
    spike_increment: 0.15
    min: 0.0
    max: 3.0
    detach_spikes: true

lif_inh:
  tau:
    learnable: true
    mode: shared
    min: 5.0
    max: 12.0
    init: 8.0

  threshold:
    learnable: true
    mode: shared
    min: 0.1
    max: 0.5
    init: 0.3

  adaptive_threshold:
    enabled: true
    mode: shared
    init: 0.0
    decay: 0.95
    spike_increment: 0.15
    min: 0.0
    max: 3.0
    detach_spikes: true

training:
  seed: 42
  deterministic: false
  batch_size: 32
  num_workers: 0
  pin_memory: true
  epochs: 10
  optimizer: adamw
  lr: 1e-4
  weight_decay: 1e-5
  criterion: cross_entropy
  grad_clip_norm: 1.0

  lambda_balance: 0.0
  lambda_entropy: 0.0
  lambda_inh_usage: 0.0
  target_inh_usage: 0.3

logging:
  base_dir: logs

checkpoints:
  base_dir: checkpoints
  best_name_template: best_{run_name}.pt
  latest_name_template: latest_{run_name}.pt

runtime:
  device: cuda