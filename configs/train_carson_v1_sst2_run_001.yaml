experiment:
  dataset_name: sst2
  model_name: cats
  routing_type: carson_v1
  run_name: run_001

data:
  processed_root: data/processed
  train_split: train
  val_split: validation
  test_split: test
  has_test: true

model:
  embedding_dim: 768
  hidden_dim: 256
  num_classes: 2
  excitatory_ratio: 0.5
  kwargs: {}

routing:
  routing_type: carson_v1
  kwargs:
    embedding_dim: 768
    num_groups: 2
    num_iterations: 3
    hidden_dim: 256
    dropout: 0.1
    temperature: 1.0
    use_residual: true
    use_layernorm: true

lif:
  tau:
    learnable: true
    mode: per_group
    min: 0.5
    max: 20.0
    init: 2.0

  threshold:
    learnable: false
    mode: shared
    min: 0.1
    max: 5.0
    init: 1.0

training:
  seed: 42
  deterministic: false
  batch_size: 32
  epochs: 10
  optimizer: adam
  lr: 0.001
  weight_decay: 1.0e-5
  num_workers: 0
  pin_memory: true
  criterion: cross_entropy

logging:
  base_dir: logs

checkpoints:
  base_dir: checkpoints
  best_name_template: best_{run_name}.pt
  latest_name_template: latest_{run_name}.pt

runtime:
  device: cuda