experiment:
  dataset_name: sst2
  model_name: cats
  routing_type: linear
  run_name: run_001

data:
  processed_root: data/processed
  train_split: train
  val_split: validation
  test_split: test
  has_test: true

model:
  embedding_dim: 768
  hidden_dim: 256
  num_classes: 2
  excitatory_ratio: 0.5
  kwargs: {}

routing:
  kwargs:
    embedding_dim: 768
    num_groups: 2
    use_residual: true
    use_layernorm: true

lif:
  tau:
    learnable: true
    mode: per_group
    min: 0.5
    max: 20.0
    init: 2.0

  threshold:
    learnable: false
    mode: shared
    min: 0.1
    max: 5.0
    init: 0.3

training:
  seed: 42
  deterministic: false
  batch_size: 32
  num_workers: 0
  pin_memory: true
  epochs: 10
  optimizer: adamw
  lr: 1e-4
  weight_decay: 1e-5
  criterion: cross_entropy
  grad_clip_norm: 1.0

  lambda_balance: 0.02
  lambda_entropy: 0.005
  lambda_inh_usage: 0.01
  target_inh_usage: 0.5

logging:
  base_dir: logs

checkpoints:
  base_dir: checkpoints
  best_name_template: best_{run_name}.pt
  latest_name_template: latest_{run_name}.pt

runtime:
  device: cuda