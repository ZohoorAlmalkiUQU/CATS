experiment:
  dataset_name: sst2
  model_name: cats
  routing_type: carson
  run_name: run_001
  seed: 42

data:
  processed_root: data/processed
  train_split: train
  val_split: validation
  test_split: test
  has_test: true
  num_workers: 0
  pin_memory: true

model:
  class_path: cats.model.CATSClassifier
  embedding_dim: 768
  hidden_dim: 256
  num_classes: 2
  excitatory_ratio: 0.5
  num_groups: 2
  kwargs: {}

routing:
  kwargs:
    embedding_dim: 768
    hidden_dim: 256
    num_groups: 2
    num_iterations: 3
    dropout: 0.1
    temperature: 1.0
    use_residual: true
    use_layernorm: true

lif_exc:
  num_groups: 1
  reset_to_zero: true
  detach_reset: false

  tau:
    learnable: true
    mode: shared
    min: 12.0
    max: 24.0
    init: 18.0

  threshold:
    learnable: true
    mode: shared
    min: 0.8
    max: 1.8
    init: 1.2

  adaptive_threshold:
    enabled: true
    mode: shared
    init: 0.0
    decay: 0.95
    spike_increment: 0.15
    min: 0.0
    max: 3.0
    detach_spikes: true

lif_inh:
  num_groups: 1
  reset_to_zero: true
  detach_reset: false

  tau:
    learnable: true
    mode: shared
    min: 5.0
    max: 12.0
    init: 8.0

  threshold:
    learnable: true
    mode: shared
    min: 0.1
    max: 0.5
    init: 0.3

  adaptive_threshold:
    enabled: true
    mode: shared
    init: 0.0
    decay: 0.95
    spike_increment: 0.15
    min: 0.0
    max: 3.0
    detach_spikes: true

classifier:
  input_dim: 256
  kwargs:
    hidden_dim: null
    dropout: 0.0
    use_layernorm: false

training:
  seed: 42
  deterministic: false
  batch_size: 32
  epochs: 10

  optimizer: adamw
  lr: 1e-4
  weight_decay: 1e-5

  criterion: cross_entropy
  grad_clip_norm: 1.0

  early_stopping:
    enabled: true
    patience: 3
    min_delta: 0.001
    monitor: val_f1
    mode: max

  lambda_balance: 0.5
  lambda_entropy: 0.001
  lambda_inh_usage: 0.5
  target_inh_usage: 0.3

logging:
  base_dir: logs

checkpoints:
  base_dir: checkpoints
  best_name_template: best_{run_name}.pt
  latest_name_template: latest_{run_name}.pt

runtime:
  device: cuda