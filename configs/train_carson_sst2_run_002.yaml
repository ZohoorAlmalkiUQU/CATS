# NOTE:
# Run 002 uses positive inhibitory currents by disabling the explicit sign flip
# in the encoder core:
#   # inh = -inh
#
# Purpose:
# - Test whether removing the negative inhibitory current improves optimization stability
# - Check whether the inhibitory group can participate without collapsing
# - Isolate the effect of current sign from overly strong auxiliary losses
#
# Expected comparison against run_001:
# - Higher inhibitory firing/activity
# - Less extreme routing dominance by the excitatory group
# - More stable training dynamics overall

experiment:
  dataset_name: sst2
  model_name: cats
  routing_type: carson
  run_name: run_002

data:
  processed_root: data/processed
  train_split: train
  val_split: validation
  test_split: test
  has_test: true

model:
  embedding_dim: 768
  hidden_dim: 256
  num_classes: 2
  excitatory_ratio: 0.5
  kwargs: {}

routing:
  kwargs:
    embedding_dim: 768
    num_groups: 2
    num_iterations: 3
    hidden_dim: 256
    dropout: 0.1
    temperature: 1.0
    use_residual: true
    use_layernorm: true

lif:
  tau:
    learnable: true
    mode: per_group
    min: [12.0, 5.0]
    max: [24.0, 12.0]
    init: [18.0, 8.0]

  threshold:
    learnable: true
    mode: per_group
    min: [0.8, 0.6]
    max: [1.8, 1.2]
    init: [1.2, 0.9]

training:
  seed: 42
  deterministic: false
  batch_size: 32
  num_workers: 0
  pin_memory: true
  epochs: 10
  optimizer: adamw
  lr: 1e-4
  weight_decay: 1e-5
  criterion: cross_entropy
  grad_clip_norm: 1.0

  # Reduced auxiliary losses for cleaner evaluation of positive-current behavior
  lambda_balance: 0.05
  lambda_entropy: 0.0005
  lambda_inh_usage: 0.05
  target_inh_usage: 0.3

# Routing regularization parameters are unified for Linear and CARSON routers.
# Reason:
# - Both routers produce learnable (non-deterministic) routing distributions.
# - Their routing behavior is optimized during training and can be influenced by auxiliary losses.
# - Using the same regularization settings ensures a fair comparison between routing mechanisms,
#   isolating the effect of the routing architecture itself rather than differences in tuning.

logging:
  base_dir: logs

checkpoints:
  base_dir: checkpoints
  best_name_template: best_{run_name}.pt
  latest_name_template: latest_{run_name}.pt

runtime:
  device: cuda